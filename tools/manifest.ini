# Release-owned manifest, schema 3: shipped addresses only. Literal INI values: no quotes or shell code.
# Relative paths in [paths], [profile_renderers], [commands] and [wallpaper_folders] resolve beside
# this file; [user_paths] resolve beside the user settings.ini. The release root is never resolved
# through symlinks, so a path read through `current` stays under `current`.
# `shell` is the shipped QML tree. `quickshell` is the generated tree that Quickshell loads: links
# into `shell` with the generated files beside them (scripts/prepare-runtime). It is the runtime
# directory, so `runtime` and `quickshell` name one directory; [bootstrap] files live inside it.
# Only leading ${HOME} / ${XDG_*_HOME} tokens are expanded by the path reader.
# Shapes of user data this release can read (see migrations/README.md): reads_min <= reads_max.
[ui_shell]
schema = 3
reads_min = 1
reads_max = 1

[paths]
scripts = scripts
shell = shell
quickshell = ${XDG_CACHE_HOME}/ui-shell/runtime
hypr = hypr
profileCache = ${XDG_CACHE_HOME}/ui-shell/profiles
# Read-only second search root for Themes and profiles; user entries with the same id win.
shippedThemes = shipped/themes
shippedProfiles = shipped/profiles
runtime = ${XDG_CACHE_HOME}/ui-shell/runtime

[user_paths]
themes = themes
profiles = profiles
components = components
userLua = lua

[bootstrap]
runtime = ${XDG_CACHE_HOME}/ui-shell/runtime/config/GeneratedRuntime.qml
wallpaperCatalog = ${XDG_CACHE_HOME}/ui-shell/runtime/config/GeneratedWallpapers.qml
profileModule = ${XDG_CACHE_HOME}/ui-shell/runtime/config/ProfileBundle

[profile_renderers]
quickshell = scripts/render-profile-quickshell
hyprland = scripts/render-profile-hyprland
hyprpaper = scripts/render-profile-hyprpaper

[commands]
readIni = scripts/read-ini
readShellConfig = scripts/read-shell-config
prepareRuntime = scripts/prepare-runtime
readThemeProfile = scripts/read-theme-profile
readWallpaperSelections = scripts/read-wallpaper-selections
readThemeState = scripts/read-theme-state
themeCatalog = scripts/theme-catalog
renderThemeEditor = scripts/render-theme-editor
readThemeEditor = scripts/read-theme-editor
readThemePalette = scripts/read-theme-palette
refreshTheme = scripts/refresh-theme
saveThemeProfile = scripts/save-theme-profile
activateThemeProfile = scripts/activate-theme-profile
selectThemeProfile = scripts/select-theme-profile
publishThemeBundle = scripts/publish-theme-bundle
compileThemeProfile = scripts/compile-theme-profile
renderThemeProfile = scripts/render-theme-profile
renderWallpaperRegistry = scripts/render-wallpaper-registry
renderRuntime = scripts/render-runtime-config
preparePalettes = scripts/prepare-palettes
extractColors = scripts/extract-colors
cacheWallpaperColors = scripts/cache-wallpaper-colors
renderHyprColors = scripts/render-hypr-colors
renderShellColors = scripts/render-shell-colors
renderMonitorPalettes = scripts/render-shell-monitor-palettes
renderHyprpaper = scripts/render-hyprpaper-config
renderWallpaperCatalog = scripts/render-wallpaper-catalog
renderWallpaperTargets = scripts/render-wallpaper-targets
selectWallpaper = scripts/select-wallpaper
renderWallpaperSelection = scripts/render-wallpaper-selection
applyWallpaper = scripts/apply-wallpaper
componentSettingsPath = scripts/component-settings-path
readComponentSettings = scripts/read-component-settings
saveComponentSettings = scripts/save-component-settings
renderLauncherSettings = scripts/render-launcher-settings
renderPickerSettings = scripts/render-picker-settings
renderControlTuning = scripts/render-control-tuning
audioGraph = scripts/audio-graph
renderAudioSettings = scripts/render-audio-settings
screenRecord = scripts/screen-record
screenShot = scripts/screen-shot
clipboard = scripts/clipboard
renderRecordSettings = scripts/render-record-settings
renderShotSettings = scripts/render-shot-settings
renderMprisSettings = scripts/render-mpris-settings
mediaArt = scripts/media-art
notifySound = scripts/notify-sound
normalizeCustomColors = scripts/normalize-custom-colors
normalizeThemeColors = scripts/normalize-theme-colors
renderThemeColors = scripts/render-theme-colors

[wallpaper_folders]
# Shipped folders. IDs are stable; the user adds more in settings.ini.
default = default
