# User-owned Bash configuration for tools/scripts/toolkit-sandbox. Every resource
# shared with the host is listed here; nothing else of the host is visible.
# Decision: brain page toolkit-sandbox (follows isolated-nested-test-environment).
readonly sandbox_home=/home/rice
readonly sandbox_runtime=/run/rice
readonly sandbox_dbus_config=tests/session-bus.conf
readonly sandbox_parent_display=wayland-0
# X11 toolkits share only this path socket of the host Xwayland (it runs without -auth).
readonly sandbox_x11_display=:0
readonly sandbox_x11_socket=/tmp/.X11-unix/X0
# "render-nodes" shares only /dev/dri/renderD*; "software" exposes no GPU nodes.
readonly sandbox_graphics=render-nodes
# "keep" retains the run directory (logs, trace, final private home); "discard" removes it.
readonly sandbox_logs=keep
readonly sandbox_log_parent=/tmp
readonly -a sandbox_namespace_options=(--unshare-all --die-with-parent --new-session --cap-drop ALL)
readonly -a sandbox_readonly_system_paths=(/usr /etc /sys)

# Host theming is replaced by empty read-only tmpfs: toolkit config dirs, installed
# themes, colour schemes and theme plugins. Icons, cursors and fonts stay visible.
readonly -a sandbox_masked_paths=(
  /etc/xdg /etc/gtk-2.0 /etc/gtk-3.0 /etc/gtk-4.0
  /usr/share/themes /usr/share/Kvantum /usr/share/color-schemes /usr/share/qt5ct /usr/share/qt6ct
  /usr/lib/qt/plugins/styles /usr/lib/qt/plugins/platformthemes /usr/lib/qt/plugins/wayland-decoration-client
  /usr/lib/qt6/plugins/styles /usr/lib/qt6/plugins/platformthemes /usr/lib/qt6/plugins/wayland-decoration-client
  /usr/lib/gtk-2.0/2.10.0/engines
)

# Every toolkit must state each of these keys either in sandbox_env_<tk> (a value)
# or in sandbox_unset_<tk> (deliberately absent, the toolkit's built-in default).
readonly -a sandbox_selection_keys=(
  GTK_THEME GTK2_RC_FILES GTK_PATH GTK_MODULES GSETTINGS_BACKEND
  QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE QT_QUICK_CONTROLS_STYLE QT_QUICK_CONTROLS_CONF
  QT_PLUGIN_PATH QT_QPA_PLATFORM QT_WAYLAND_DECORATION GDK_BACKEND
  XCURSOR_THEME XCURSOR_SIZE XCURSOR_PATH XDG_DATA_DIRS XDG_CONFIG_DIRS
)
# A theme directory's sandbox.env may set only these keys (values may use ${HOME}).
readonly -a sandbox_theme_env_keys=("${sandbox_selection_keys[@]}" LD_LIBRARY_PATH)

# Shared by every toolkit. XDG_CONFIG_DIRS points at the masked, empty /etc/xdg.
readonly -a sandbox_env_common=(
  GSETTINGS_BACKEND=memory XCURSOR_THEME=Adwaita XCURSOR_SIZE=24 XCURSOR_PATH=/usr/share/icons
  XDG_DATA_DIRS=/usr/share XDG_CONFIG_DIRS=/etc/xdg LANG=C.UTF-8 PATH=/usr/bin
)

# Demo repo per toolkit, relative to the project root.
declare -A sandbox_demo=(
  [qt4]=projects/rice-qt4/demo [qt5]=projects/rice-qt5/demo [qt6]=projects/rice-qt6/demo
  [gtk2]=projects/rice-gtk2/demo [gtk3]=projects/rice-gtk3/demo [gtk4]=projects/rice-gtk4/demo
  [adw]=projects/rice-adw/demo
)
readonly -A sandbox_demo
# Toolkits that need the host X server (no Wayland backend).
readonly -a sandbox_x11_toolkits=(qt4 gtk2)

# Qt: "generic" is Qt's built-in platform theme (no plugin), Fusion its built-in style.
# QT_QUICK_CONTROLS_STYLE stays unset so an app's qtquickcontrols2.conf (flatstyle)
# decides, then Qt's own default; setting it would override that conf.
readonly -a sandbox_env_qt6=(QT_QPA_PLATFORM=wayland QT_QPA_PLATFORMTHEME=generic QT_STYLE_OVERRIDE=Fusion)
readonly -a sandbox_unset_qt6=(QT_QUICK_CONTROLS_STYLE QT_QUICK_CONTROLS_CONF QT_PLUGIN_PATH QT_WAYLAND_DECORATION
  GTK_THEME GTK2_RC_FILES GTK_PATH GTK_MODULES GDK_BACKEND)
readonly -a sandbox_env_qt5=("${sandbox_env_qt6[@]}")
readonly -a sandbox_unset_qt5=("${sandbox_unset_qt6[@]}")
# Qt 4 ignores QT_STYLE_OVERRIDE and platform themes; it reads ~/.config/Trolltech.conf (private).
# The private IPC namespace stops the X server attaching MIT-SHM segments; use plain X transfers.
readonly -a sandbox_env_qt4=(QT_QPA_PLATFORM=xcb QT_X11_NO_MITSHM=1 LD_LIBRARY_PATH=@DEMO@/build/prefix/lib)
readonly -a sandbox_unset_qt4=(QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE QT_QUICK_CONTROLS_STYLE QT_QUICK_CONTROLS_CONF
  QT_PLUGIN_PATH QT_WAYLAND_DECORATION GTK_THEME GTK2_RC_FILES GTK_PATH GTK_MODULES GDK_BACKEND)
# GTK2: the rc list is exactly the private ~/.gtkrc-2.0 (no /etc/gtk-2.0/gtkrc).
readonly -a sandbox_env_gtk2=(GDK_BACKEND=x11 GTK2_RC_FILES=@HOME@/.gtkrc-2.0 NO_AT_BRIDGE=1)
readonly -a sandbox_unset_gtk2=(GTK_THEME GTK_PATH GTK_MODULES QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE
  QT_QUICK_CONTROLS_STYLE QT_QUICK_CONTROLS_CONF QT_PLUGIN_PATH QT_QPA_PLATFORM QT_WAYLAND_DECORATION)
# GTK3/GTK4/libadwaita: GTK_THEME unset so settings.ini and GSettings (memory) decide.
# No a11y bus exists on the private bus; say so instead of letting GTK search for it.
readonly -a sandbox_env_gtk3=(GDK_BACKEND=wayland GTK_A11Y=none NO_AT_BRIDGE=1)
readonly -a sandbox_unset_gtk3=(GTK_THEME GTK2_RC_FILES GTK_PATH GTK_MODULES QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE
  QT_QUICK_CONTROLS_STYLE QT_QUICK_CONTROLS_CONF QT_PLUGIN_PATH QT_QPA_PLATFORM QT_WAYLAND_DECORATION)
readonly -a sandbox_env_gtk4=("${sandbox_env_gtk3[@]}")
readonly -a sandbox_unset_gtk4=("${sandbox_unset_gtk3[@]}")
readonly -a sandbox_env_adw=("${sandbox_env_gtk3[@]}")
readonly -a sandbox_unset_adw=("${sandbox_unset_gtk3[@]}")

# Apps per toolkit: name|binary|working dir|extra env (comma separated), paths relative to the demo.
readonly -a sandbox_apps_qt6=(
  widgets-gallery\|build/widgets-gallery/gallery\|.\|
  quick-gallery\|build/quick-gallery/galleryexample\|.\|
  quick-flatstyle\|build/quick-flatstyle/flatstyleexample\|.\|
)
readonly -a sandbox_apps_qt5=(
  widgets-gallery\|build/widgets-gallery/widgets-gallery\|.\|
  quick-gallery\|build/quick-gallery/quick-gallery\|.\|
  quick-flatstyle\|build/quick-flatstyle/quick-flatstyle\|.\|
)
readonly -a sandbox_apps_qt4=(
  widgets-gallery\|build/apps/widgets-gallery/widgets-gallery\|.\|
  styles\|build/apps/widgets/styles/styles\|.\|
)
readonly -a sandbox_apps_gtk2=(
  gtk-demo\|build/gtk-demo\|gtk-demo\|
  testgtk\|build/testgtk\|tests\|
)
readonly -a sandbox_apps_gtk3=(
  widget-factory\|build/gtk3-widget-factory\|build\|
  gtk-demo\|build/gtk3-demo\|build\|GSETTINGS_SCHEMA_DIR=.
  icon-browser\|build/gtk3-icon-browser\|build\|
)
readonly -a sandbox_apps_gtk4=(
  widget-factory\|build/demos/widget-factory/gtk4-widget-factory\|.\|
  gtk-demo\|build/demos/gtk-demo/gtk4-demo\|.\|GSETTINGS_SCHEMA_DIR=@DEMO@/build/demos/gtk-demo
  node-editor\|build/demos/node-editor/gtk4-node-editor\|.\|
)
readonly -a sandbox_apps_adw=(
  adwaita-demo\|build/adwaita-demo\|.\|
)
