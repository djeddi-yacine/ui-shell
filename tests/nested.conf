# User-owned Bash configuration for the test environment. Every resource shared
# with the host is listed here. No host HOME or session bus is mounted.
readonly test_home=/home/test
readonly test_runtime=/run/test
readonly test_project=/project
readonly test_config_root=/home/test/.config/ui-shell
# Each run uses the latest code. "persistent" retains this test home and
# profile bundle; "ephemeral" starts from the project selections each time.
readonly test_state_mode=ephemeral
readonly test_state_directory=.test-state/nested
readonly test_state_schema=1
readonly test_parent_display=parent-wayland
readonly test_hypr_config=hypr/nested.lua
readonly test_phantomat_config=hypr/phantomat-test.lua
readonly test_phantomat_plugin=.build/phantomat/spatialoverview.so
# Normal nested startup leaves popups closed; open the picker on demand.
readonly test_open_picker=0
readonly test_qmllint=/usr/lib/qt6/bin/qmllint
readonly test_qmltestrunner=/usr/lib/qt6/bin/qmltestrunner
readonly test_qtpaths=/usr/lib/qt6/bin/qtpaths
# Private keyboard input is local Compose, not a host/compositor IME service.
readonly test_qt_input_method=compose
readonly test_dbus_config=tests/session-bus.conf
readonly test_qt_portals=0
readonly test_icon_theme=breeze
readonly test_ready_seconds=30
readonly test_poll_seconds=0.2
readonly test_frame_settle_seconds=1
readonly test_min_frame_colors=16
readonly test_apply_wallpaper_folder=project
readonly test_apply_wallpaper_name=wallhaven-02.png
readonly test_apply_seconds=30
readonly test_wallpaper_probe_size=32
readonly test_cleanup_seconds=3
readonly test_exit_seconds=10
readonly test_process_prefix=ui-shell-test
# Fast test iteration: only this run's tagged sandbox processes are killed.
# Set TERM to give them test_cleanup_seconds before KILL.
readonly test_shutdown_signal=KILL
# The native manager bridge belongs to tests, not the shell. The host session
# bus itself is not mounted; this proxy exposes only its systemd manager API.
readonly test_app_runner=tests/scripts/run-app2unit
readonly test_manager_socket=manager-bus
readonly test_app2unit_seconds=10
# The harness closes the whole run, including the watchdog, with its window.
readonly -a test_compositor_command=(start-hyprland --)
# Every run compiles a complete private bundle before opening the nested window.
# A bounded visual check of file colors; import does not change wallpaper.
readonly test_theme_reference=refs/100-themes
readonly test_theme_sample=synthwave/dark
readonly test_theme_positive=green
readonly test_theme_warning=yellow
readonly test_theme_negative=red
readonly test_gsettings_backend=memory

# "render-nodes" shares only /dev/dri/renderD*; "software" exposes no GPU nodes.
readonly test_graphics=render-nodes
# "keep" retains diagnostic logs and nested frames; "discard" removes them.
readonly test_logs=keep
readonly test_log_parent=/tmp
readonly -a test_frame_artifacts=(
  frame.png frame-applied.png frame-launcher.png frame-launcher-search-candidate.png
  frame-launcher-starting.png
  frame-launcher-info.png frame-launcher-settings.png frame-launcher-dropdown.png
  frame-launcher-error.png frame-settings-error.png frame-picker-error.png
  frame-picker-info.png frame-picker-settings.png
  frame-theme-editor.png frame-theme-color.png frame-theme-error.png
  frame-app-launch.png
  frame-borders-default.png frame-borders-output.png
  frame-workspaces.png frame-phantomat.png
  frame-phantomat-before.png frame-phantomat-colors.png frame-phantomat-lens.png
  state-gallery.png tuning-editor.png mode-gallery.png
)

readonly -a test_readonly_system_paths=(/usr /etc /sys)
readonly -a test_copied_project_parts=(hypr shell scripts default tools tests)
# Runtime code is disposable even when the private configuration is retained.
readonly -a test_ephemeral_config_parts=(scripts quickshell hypr)
readonly -a test_reference_parts=("$test_theme_reference")
readonly -a test_readonly_project_parts=(wallpapers)
readonly -a test_protected_host_paths=(
  default/default.png default/profile.ini default/theme.ini
  shell/config/GeneratedWallpapers.qml shell/config/GeneratedLauncherOutput.qml
  shell/config/GeneratedRuntime.qml tools/config.ini
)
readonly -a test_namespace_options=(--unshare-all --die-with-parent --new-session --cap-drop ALL)
